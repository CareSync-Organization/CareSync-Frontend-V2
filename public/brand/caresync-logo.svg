<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>

    <!-- Badge background gradient — mimics the app's teal primary -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa99f"/>
      <stop offset="100%" stop-color="#2a7f7a"/>
    </linearGradient>

    <!-- Glow / drop shadow filter on accent elements -->
    <filter id="glow" x="-36%" y="-36%" width="172%" height="172%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="rgba(103,232,249,0.52)" flood-opacity="1"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#67E8F9" flood-opacity="0.35"/>
    </filter>

    <!-- Main stroke gradient (accentSoft → accent → primaryDeep) -->
    <linearGradient id="strokeGrad" x1="54" y1="68" x2="202" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ECFEFF"/>
      <stop offset="42%"  stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>

    <!-- Orbit ring gradient -->
    <linearGradient id="orbitGrad" x1="58" y1="60" x2="198" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#67E8F9" stop-opacity="0.1"/>
      <stop offset="45%"  stop-color="#ECFEFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Trail gradient (right) -->
    <linearGradient id="trailRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="56%"  stop-color="#67E8F9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ECFEFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Badge rounded-rect clip -->
    <clipPath id="badgeClip">
      <rect x="0" y="0" width="256" height="256" rx="52" ry="52"/>
    </clipPath>

  </defs>

  <!-- ── Badge shell ── -->
  <!-- Main teal background -->
  <rect x="0" y="0" width="256" height="256" rx="52" ry="52" fill="url(#badgeBg)"/>
  <!-- Subtle inner ring (ring-white/20) -->
  <rect x="1" y="1" width="254" height="254" rx="51" ry="51" fill="none"
        stroke="rgba(255,255,255,0.20)" stroke-width="2"/>


  <!-- ── Logo mark — scaled to 76% of 256 = ~195px, centred ── -->
  <!-- All coordinates below are in the original 256×256 viewBox space,
       scaled and translated so the mark sits centred in the badge -->
  <g transform="translate(28,28) scale(0.78)">

    <!-- Orbit dashed ring -->
    <path d="M58 128 C75 86 100 60 128 60 C156 60 181 86 198 128 C181 170 156 196 128 196 C100 196 75 170 58 128Z"
          fill="none"
          stroke="url(#orbitGrad)"
          stroke-width="2"
          stroke-dasharray="18 12"
          opacity="0.9"/>

    <!-- Core loop fill (surface at light tone opacity ~0.12) -->
    <path d="M64 128 C78 98 101 82 128 82 C155 82 178 98 192 128 C178 158 155 174 128 174 C101 174 78 158 64 128Z"
          fill="rgba(255,255,255,0.12)"
          stroke="rgba(255,255,255,0.24)"
          stroke-width="2"/>

    <!-- Top arc stroke -->
    <path d="M64 116 C78 84 101 66 128 66 C155 66 178 84 192 116"
          fill="none"
          stroke="url(#strokeGrad)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Bottom arc stroke -->
    <path d="M64 140 C78 172 101 190 128 190 C155 190 178 172 192 140"
          fill="none"
          stroke="url(#strokeGrad)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Trail lines (idle state — hidden, but we show them subtly for the static render) -->
    <!-- In idle state nodes are top=(128,40) center=(128,128) bottom=(128,216) -->
    <!-- We render the static idle state: no trails visible (opacity 0 in idle) -->

    <!-- Top node -->
    <circle cx="128" cy="40" r="8"
            fill="#FFFFFF"
            stroke="#ECFEFF"
            stroke-width="2"/>

    <!-- Center node (accentSoft fill, accent stroke, glow) -->
    <circle cx="128" cy="128" r="10"
            fill="#ECFEFF"
            stroke="#67E8F9"
            stroke-width="2.5"
            filter="url(#glow)"/>

    <!-- Bottom node -->
    <circle cx="128" cy="216" r="8"
            fill="#FFFFFF"
            stroke="#ECFEFF"
            stroke-width="2"/>

  </g>

</svg>
